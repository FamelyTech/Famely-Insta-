# Default values for django.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

djprod: 2

site: stage

image:
  repository: registry.digitalocean.com/nano-registry/jalodei
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: nano-registry

pullSecret:  
  secrets: secret
  namespace: default

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  annotations: {}

dbSecret: jalodei-db
dbPort: 5432
dbName: jalodei
deleteDB: false

s3:
  enabled: false
  secret: obni-s3-cred

statics: false

rdsExternal: staging.sse.aws.co

miscSecrets: jalodei-secrets

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
